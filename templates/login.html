{% extends 'base.html' %}
{% block title %}Admin Login — Park Golf Ratings{% endblock %}

{% block content %}
<div class="d-flex justify-content-center mt-5">
  <div class="card shadow-sm" style="width:100%; max-width:380px">
    <div class="card-header bg-success text-white fw-bold fs-5 text-center">
      ⛳ Admin Login
    </div>
    <div class="card-body p-4">
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control form-control-lg"
                 autofocus autocomplete="current-password" placeholder="Enter password">
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-success btn-lg">Log In</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
